name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_booking_reopen:
        description: >-
          Allow this deploy to switch a live BOOKING_ENABLED=false API/Web back to true.
          Use only after the ticket-opening evidence gates pass.
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-northeast3
  AR_REPO: grabit
  WEB_SERVICE: grabit-web
  API_SERVICE: grabit-api
  BACKGROUND_WORKER_JOB: grabit-background-worker
  VALKEY_MODE: ${{ vars.VALKEY_MODE || 'cluster' }}
  DB_POOL_MAX: ${{ vars.DB_POOL_MAX || '4' }}
  API_MIN_INSTANCES: ${{ vars.API_MIN_INSTANCES || '1' }}
  API_MAX_INSTANCES: ${{ vars.API_MAX_INSTANCES || '40' }}
  WEB_MIN_INSTANCES: ${{ vars.WEB_MIN_INSTANCES || '1' }}
  WEB_MAX_INSTANCES: ${{ vars.WEB_MAX_INSTANCES || '50' }}
  API_CPU_ALLOCATION_FLAG: ${{ vars.API_CPU_ALLOCATION_FLAG || '--no-cpu-throttling' }}
  BACKGROUND_PROCESSING_ENABLED: ${{ vars.BACKGROUND_PROCESSING_ENABLED || 'true' }}
  # Sitewide booking gate shared by API, Web and the background worker. Unset keeps
  # the current production behaviour (open). The kill-switch procedure in
  # docs/runbooks/managed-demo-cost-floor.md changes this variable first. The
  # migrate job refuses a reopen and records each service's live value and revision,
  # and deploy-api/deploy-web re-read the live value right before deploying so a close
  # made mid-run is preserved, also in a run dispatched with allow_booking_reopen=true.
  BOOKING_ENABLED: ${{ vars.BOOKING_ENABLED || 'true' }}
  # Prewarm patches the service-level minimum (no new revision). 'template' is the
  # Phase 24-21 revision-template fallback if the service-level update is refused.
  PREWARM_SCALING_SCOPE: ${{ vars.PREWARM_SCALING_SCOPE || 'service' }}
  API_CONCURRENCY: ${{ vars.API_CONCURRENCY || '250' }}
  # Migration sessions fail fast instead of queueing hot-table traffic behind an
  # ACCESS EXCLUSIVE lock request inside drizzle's single migration transaction.
  MIGRATION_LOCK_TIMEOUT: ${{ vars.MIGRATION_LOCK_TIMEOUT || '5s' }}
  MIGRATION_STATEMENT_TIMEOUT: ${{ vars.MIGRATION_STATEMENT_TIMEOUT || '60s' }}
  # Set to true for the ticket-opening/entry window: any pending migration fails the deploy.
  MIGRATION_FREEZE: ${{ vars.MIGRATION_FREEZE || 'false' }}
  # Worst-case PostgreSQL connection budget inputs. The budget counts each process's
  # real pg-boss cap: RUNTIME_PGBOSS_POOL_MAX when set, otherwise the code default
  # (3 with background processing, 1 for a producer-only API; the worker Job is 3).
  DB_CONNECTION_RESERVE: ${{ vars.DB_CONNECTION_RESERVE || '5' }}
  DB_CONNECTION_BUDGET_ENFORCE: ${{ vars.DB_CONNECTION_BUDGET_ENFORCE || 'false' }}
  # Optional runtime settings, passed to the API and worker only when the repository
  # variable is set (deploy-guards.mjs runtime-env); unset keeps each process's code
  # default. RUNTIME_PGBOSS_POOL_MAX has no default on purpose: the producer-only API
  # uses 1 pg-boss connection and the worker 3. Removing a variable later does not
  # remove a value already set on the API service (env vars are merged); the database
  # preflight counts such a leftover PGBOSS_POOL_MAX and warns. See the cost-floor runbook.
  RUNTIME_PGBOSS_POOL_MAX: ${{ vars.PGBOSS_POOL_MAX }}
  RUNTIME_PGBOSS_START_MAX_ATTEMPTS: ${{ vars.PGBOSS_START_MAX_ATTEMPTS }}
  RUNTIME_DB_STATEMENT_TIMEOUT_MS: ${{ vars.DB_STATEMENT_TIMEOUT_MS }}
  RUNTIME_DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: ${{ vars.DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS }}
  RUNTIME_PAYMENT_HANDOFF_ABANDON_SWEEP_ENABLED: ${{ vars.PAYMENT_HANDOFF_ABANDON_SWEEP_ENABLED }}
  RUNTIME_SMS_ALLOWED_COUNTRIES: ${{ vars.SMS_ALLOWED_COUNTRIES }}
  RUNTIME_SMS_GLOBAL_SEND_LIMIT_PER_MINUTE: ${{ vars.SMS_GLOBAL_SEND_LIMIT_PER_MINUTE }}
  RUNTIME_SMS_GLOBAL_SEND_LIMIT_PER_HOUR: ${{ vars.SMS_GLOBAL_SEND_LIMIT_PER_HOUR }}
  RUNTIME_SMS_LOCAL_RATE_LIMITS_ENABLED: ${{ vars.SMS_LOCAL_RATE_LIMITS_ENABLED }}
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Start-of-run live BOOKING_ENABLED (true/false/unreadable) and latest revision of
    # each service, read by the deploy jobs' booking gate re-check.
    outputs:
      api_live: ${{ steps.booking_guard.outputs.api_live }}
      api_revision: ${{ steps.booking_guard.outputs.api_revision }}
      web_live: ${{ steps.booking_guard.outputs.web_live }}
      web_revision: ${{ steps.booking_guard.outputs.web_revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Validate production origins
        run: |
          node - <<'NODE'
          const values = {
            CLOUD_RUN_API_URL: process.env.CLOUD_RUN_API_URL,
            CLOUD_RUN_WEB_URL: process.env.CLOUD_RUN_WEB_URL,
          };
          const localHosts = new Set(['localhost', '127.0.0.1', '0.0.0.0', '::1']);

          for (const [name, value] of Object.entries(values)) {
            if (!value || value.trim() !== value) {
              throw new Error(`${name} must be set without surrounding whitespace`);
            }

            const url = new URL(value);
            if (url.protocol !== 'https:') {
              throw new Error(`${name} must be an https URL`);
            }
            if (url.origin !== value) {
              throw new Error(`${name} must be an origin only, e.g. https://api.heygrabit.com`);
            }

            const hostname = url.hostname.replace(/^\[|\]$/g, '').toLowerCase();
            if (localHosts.has(hostname)) {
              throw new Error(`${name} must not point to localhost`);
            }
          }
          NODE
        env:
          CLOUD_RUN_API_URL: ${{ vars.CLOUD_RUN_API_URL }}
          CLOUD_RUN_WEB_URL: ${{ vars.CLOUD_RUN_WEB_URL }}
      - name: Validate deploy configuration
        # Also exports PGOPTIONS (lock_timeout/statement_timeout) for every later
        # database session in this job, including drizzle-kit migrate.
        run: node scripts/managed-demo/deploy-guards.mjs validate-config
      - run: pnpm install --frozen-lockfile
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Guard sitewide booking gate
        id: booking_guard
        env:
          ALLOW_BOOKING_REOPEN: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_booking_reopen == true }}
        run: |
          for service in "${API_SERVICE}" "${WEB_SERVICE}"; do
            if ! gcloud run services describe "${service}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format=json > "${RUNNER_TEMP}/${service}.json"; then
              # Unreadable live state: the guard only allows closing or an explicit reopen.
              : > "${RUNNER_TEMP}/${service}.json"
            fi
          done
          node scripts/managed-demo/deploy-guards.mjs booking-gate \
            --service "${API_SERVICE}=${RUNNER_TEMP}/${API_SERVICE}.json" \
            --service "${WEB_SERVICE}=${RUNNER_TEMP}/${WEB_SERVICE}.json" \
            --snapshot "api=${API_SERVICE}" \
            --snapshot "web=${WEB_SERVICE}"
      - name: Start Cloud SQL Auth Proxy
        run: |
          gcloud components install cloud-sql-proxy --quiet 2>/dev/null || true
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port=5432 &
          for i in $(seq 1 30); do
            if nc -z localhost 5432; then
              echo "Cloud SQL Proxy ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Cloud SQL Proxy failed to accept connections within 30s" >&2
          exit 1
      - name: Database preflight (migration timeouts, freeze, connection budget)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # The booking guard step saved the live API description. With PGBOSS_POOL_MAX unset,
        # the budget still counts a value an earlier deploy left on the API service.
        run: node scripts/managed-demo/deploy-guards.mjs db-preflight --api-service-json "${RUNNER_TEMP}/${API_SERVICE}.json"
      - name: Pre-apply event category enum migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm --filter @grabit/api exec node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import pg from 'pg';

          const migrationPath = join(
            process.cwd(),
            'src/database/migrations/0009_two_event_categories.sql',
          );
          const source = await readFile(migrationPath, 'utf8');
          const statements = source
            .split('--> statement-breakpoint')
            .map((statement) => statement.trim())
            .filter(Boolean);

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });

          await client.connect();
          try {
            for (const statement of statements) {
              await client.query(statement);
            }
          } finally {
            await client.end();
          }
          NODE
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @grabit/api exec drizzle-kit migrate

  build-api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev
      - uses: docker/setup-buildx-action@v4
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.API_SERVICE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=grabit-api
          cache-to: type=gha,mode=max,scope=grabit-api

  build-web-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev
      - uses: docker/setup-buildx-action@v4
      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.CLOUD_RUN_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.CLOUD_RUN_API_URL }}
            NEXT_PUBLIC_R2_HOSTNAME=${{ secrets.R2_PUBLIC_HOSTNAME }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
            NEXT_PUBLIC_TOSS_FOREIGN_EASY_PAY_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_TOSS_FOREIGN_EASY_PAY_CLIENT_KEY }}
            NEXT_PUBLIC_TOSS_PAYMENT_WIDGET_VARIANT_KEY=${{ vars.NEXT_PUBLIC_TOSS_PAYMENT_WIDGET_VARIANT_KEY }}
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.WEB_SERVICE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=grabit-web
          cache-to: type=gha,mode=max,scope=grabit-web

  deploy-api:
    runs-on: ubuntu-latest
    needs:
      - migrate-production
      - build-api-image
      - build-web-image
      - deploy-background-worker
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Require active worker schedule before scale-to-zero
        if: env.API_MIN_INSTANCES == '0'
        run: |
          SCHEDULER_STATE=$(gcloud scheduler jobs describe grabit-background-worker-every-5m \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}" \
            --format='value(state)')
          test "${SCHEDULER_STATE}" = 'ENABLED'
      - name: Re-check sitewide booking gate before deploy
        id: booking_gate
        env:
          ALLOW_BOOKING_REOPEN: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_booking_reopen == true }}
          LIVE_AT_GUARD: ${{ needs.migrate-production.outputs.api_live }}
          REVISION_AT_GUARD: ${{ needs.migrate-production.outputs.api_revision }}
        run: |
          # Migrations already ran; retry a transient describe error instead of
          # failing this job and leaving the deploy half done.
          for attempt in 1 2 3; do
            if gcloud run services describe "${API_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format=json > "${RUNNER_TEMP}/live-service.json"; then
              break
            fi
            : > "${RUNNER_TEMP}/live-service.json"
            if [ "${attempt}" -lt 3 ]; then sleep 5; fi
          done
          node scripts/managed-demo/deploy-guards.mjs booking-gate-value \
            --service "${API_SERVICE}=${RUNNER_TEMP}/live-service.json" \
            --live-at-guard "${LIVE_AT_GUARD}" --revision-at-guard "${REVISION_AT_GUARD}"
      - name: Resolve optional API runtime settings
        id: runtime_env
        run: node scripts/managed-demo/deploy-guards.mjs runtime-env --target api
      # Probes: startup uses /api/v1/health (Valkey PING), so a new revision only takes
      # traffic once Valkey answers, the same gate bootstrap already applies. Liveness uses
      # /api/v1/health/live (no dependency I/O), which fails only while a Valkey client is
      # stuck in the ioredis `end` state; a Valkey outage or failover never restarts instances.
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.API_SERVICE }}:${{ env.DEPLOY_SHA }}
          flags: >-
            --service-account=grapit-cloudrun@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --set-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
            --min-instances=${{ env.API_MIN_INSTANCES }}
            --max-instances=${{ env.API_MAX_INSTANCES }}
            --concurrency=${{ env.API_CONCURRENCY }}
            --timeout=3600
            --memory=512Mi
            --cpu=1
            --port=8080
            --startup-probe=httpGet.path=/api/v1/health,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=1,timeoutSeconds=1,failureThreshold=180
            --liveness-probe=httpGet.path=/api/v1/health/live,httpGet.port=8080,periodSeconds=10,timeoutSeconds=5,failureThreshold=6
            ${{ env.API_CPU_ALLOCATION_FLAG }}
            --session-affinity
            --allow-unauthenticated
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
          env_vars: |
            NODE_ENV=production
            VALKEY_MODE=${{ env.VALKEY_MODE }}
            FRONTEND_URL=${{ vars.CLOUD_RUN_WEB_URL }}
            KAKAO_CALLBACK_URL=${{ vars.CLOUD_RUN_API_URL }}/api/v1/auth/social/kakao/callback
            NAVER_CALLBACK_URL=${{ vars.CLOUD_RUN_API_URL }}/api/v1/auth/social/naver/callback
            GOOGLE_CALLBACK_URL=${{ vars.CLOUD_RUN_API_URL }}/api/v1/auth/social/google/callback
            PREWARM_ALLOWED_SERVICE_NAME=${{ env.API_SERVICE }}
            PREWARM_MAX_MIN_INSTANCES=${{ env.API_MAX_INSTANCES }}
            PREWARM_SCALING_SCOPE=${{ env.PREWARM_SCALING_SCOPE }}
            DB_POOL_MAX=${{ env.DB_POOL_MAX }}
            DB_POOL_IDLE_TIMEOUT_MS=30000
            DB_POOL_CONNECTION_TIMEOUT_MS=5000
            BACKGROUND_PROCESSING_ENABLED=${{ env.BACKGROUND_PROCESSING_ENABLED }}
            CUTOVER_GATE_LEDGER_PATH=${{ vars.CUTOVER_GATE_LEDGER_PATH || '/app/phase26/26-GATE-LEDGER.json' }}
            CUTOVER_GATE_LEDGER_MAX_AGE_DAYS=${{ vars.CUTOVER_GATE_LEDGER_MAX_AGE_DAYS || '30' }}
            R2_UPLOAD_CACHE_CONTROL_ENABLED=true
            BOOKING_ENABLED=${{ steps.booking_gate.outputs.booking_enabled }}
            PAYPAL_CHECKOUT_ENABLED=true
            ALIPAY_CHECKOUT_ENABLED=true
            PAYPAL_KRW_USD_RATE=${{ vars.PAYPAL_KRW_USD_RATE }}
            ${{ steps.runtime_env.outputs.env_vars }}
          secrets: |
            DATABASE_URL=database-url:latest
            JWT_SECRET=jwt-secret:latest
            JWT_REFRESH_SECRET=jwt-refresh-secret:latest
            KAKAO_CLIENT_ID=kakao-client-id:latest
            KAKAO_CLIENT_SECRET=kakao-client-secret:latest
            NAVER_CLIENT_ID=naver-client-id:latest
            NAVER_CLIENT_SECRET=naver-client-secret:latest
            GOOGLE_CLIENT_ID=google-client-id:latest
            GOOGLE_CLIENT_SECRET=google-client-secret:latest
            REDIS_URL=redis-url:latest
            R2_ACCOUNT_ID=r2-account-id:latest
            R2_BUCKET_NAME=r2-bucket-name:latest
            R2_PUBLIC_URL=r2-public-url:latest
            R2_ACCESS_KEY_ID=r2-access-key-id:latest
            R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest
            RESEND_API_KEY=resend-api-key:latest
            RESEND_FROM_EMAIL=resend-from-email:latest
            INFOBIP_API_KEY=infobip-api-key:latest
            INFOBIP_BASE_URL=infobip-base-url:latest
            INFOBIP_SENDER=infobip-sender:latest
            TWILIO_ACCOUNT_SID=twilio-account-sid:latest
            TWILIO_API_KEY_SID=twilio-api-key-sid:latest
            TWILIO_API_KEY_SECRET=twilio-api-key-secret:latest
            TWILIO_VERIFY_SERVICE_SID=twilio-verify-service-sid:latest
            SENTRY_DSN=sentry-dsn:latest
            TOSS_SECRET_KEY=toss-secret-key:latest
            TOSS_OVERSEAS_CARD_SECRET_KEY=toss-overseas-card-secret-key:latest
            TOSS_FOREIGN_EASY_PAY_SECRET_KEY=toss-foreign-easy-pay-secret-key:latest
            TOSS_WEBHOOK_SECRET=toss-webhook-secret:latest
            TOSS_OVERSEAS_CARD_WEBHOOK_SECRET=toss-overseas-card-webhook-secret:latest
            QR_TICKET_SECRET=qr-ticket-secret:latest
            QR_TICKET_SECRET_VERSION=qr-ticket-secret-version:latest
            QR_TICKET_SECRET_KEYRING_JSON=qr-ticket-secret-keyring-json:latest
            PREWARM_CONTROL_TOKEN=prewarm-control-token:latest
            PREWARM_PROJECT_ID=prewarm-project-id:latest
            PREWARM_REGION=prewarm-region:latest
            PREWARM_ALLOWED_SCHEDULER_EMAIL=prewarm-allowed-scheduler-email:latest
            PREWARM_ALLOWED_AUDIENCE=prewarm-allowed-audience:latest

  deploy-background-worker:
    runs-on: ubuntu-latest
    needs:
      - migrate-production
      - build-api-image
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy bounded background worker job through Cloud Run v2
        run: |
          GOOGLE_OAUTH_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          export GOOGLE_OAUTH_ACCESS_TOKEN
          node scripts/managed-demo/deploy-background-worker-v2.mjs
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          CLOUD_RUN_WEB_URL: ${{ vars.CLOUD_RUN_WEB_URL }}
          PAYPAL_KRW_USD_RATE: ${{ vars.PAYPAL_KRW_USD_RATE }}
      - name: Smoke bounded background worker job
        run: |
          gcloud run jobs execute "${BACKGROUND_WORKER_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait

  deploy-web:
    runs-on: ubuntu-latest
    # migrate-production is listed for its booking gate outputs: `needs` exposes only
    # direct dependencies.
    needs:
      - migrate-production
      - deploy-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Re-check sitewide booking gate before deploy
        id: booking_gate
        env:
          ALLOW_BOOKING_REOPEN: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_booking_reopen == true }}
          LIVE_AT_GUARD: ${{ needs.migrate-production.outputs.web_live }}
          REVISION_AT_GUARD: ${{ needs.migrate-production.outputs.web_revision }}
        run: |
          # Migrations already ran; retry a transient describe error instead of
          # failing this job and leaving the deploy half done.
          for attempt in 1 2 3; do
            if gcloud run services describe "${WEB_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format=json > "${RUNNER_TEMP}/live-service.json"; then
              break
            fi
            : > "${RUNNER_TEMP}/live-service.json"
            if [ "${attempt}" -lt 3 ]; then sleep 5; fi
          done
          node scripts/managed-demo/deploy-guards.mjs booking-gate-value \
            --service "${WEB_SERVICE}=${RUNNER_TEMP}/live-service.json" \
            --live-at-guard "${LIVE_AT_GUARD}" --revision-at-guard "${REVISION_AT_GUARD}"
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.WEB_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.WEB_SERVICE }}:${{ env.DEPLOY_SHA }}
          flags: >-
            --service-account=grapit-cloudrun@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
