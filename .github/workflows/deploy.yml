name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-northeast3
  AR_REPO: grabit
  WEB_SERVICE: grabit-web
  API_SERVICE: grabit-api
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  migrate-production:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Validate production origins
        run: |
          node - <<'NODE'
          const values = {
            CLOUD_RUN_API_URL: process.env.CLOUD_RUN_API_URL,
            CLOUD_RUN_WEB_URL: process.env.CLOUD_RUN_WEB_URL,
          };
          const localHosts = new Set(['localhost', '127.0.0.1', '0.0.0.0', '::1']);

          for (const [name, value] of Object.entries(values)) {
            if (!value || value.trim() !== value) {
              throw new Error(`${name} must be set without surrounding whitespace`);
            }

            const url = new URL(value);
            if (url.protocol !== 'https:') {
              throw new Error(`${name} must be an https URL`);
            }
            if (url.origin !== value) {
              throw new Error(`${name} must be an origin only, e.g. https://api.heygrabit.com`);
            }

            const hostname = url.hostname.replace(/^\[|\]$/g, '').toLowerCase();
            if (localHosts.has(hostname)) {
              throw new Error(`${name} must not point to localhost`);
            }
          }
          NODE
        env:
          CLOUD_RUN_API_URL: ${{ vars.CLOUD_RUN_API_URL }}
          CLOUD_RUN_WEB_URL: ${{ vars.CLOUD_RUN_WEB_URL }}
      - run: pnpm install --frozen-lockfile
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Start Cloud SQL Auth Proxy
        run: |
          gcloud components install cloud-sql-proxy --quiet 2>/dev/null || true
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} --port=5432 &
          for i in $(seq 1 30); do
            if nc -z localhost 5432; then
              echo "Cloud SQL Proxy ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Cloud SQL Proxy failed to accept connections within 30s" >&2
          exit 1
      - name: Pre-apply event category enum migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm --filter @grabit/api exec node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import pg from 'pg';

          const migrationPath = join(
            process.cwd(),
            'src/database/migrations/0009_two_event_categories.sql',
          );
          const source = await readFile(migrationPath, 'utf8');
          const statements = source
            .split('--> statement-breakpoint')
            .map((statement) => statement.trim())
            .filter(Boolean);

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });

          await client.connect();
          try {
            for (const statement of statements) {
              await client.query(statement);
            }
          } finally {
            await client.end();
          }
          NODE
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @grabit/api exec drizzle-kit migrate

  build-api-image:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev
      - uses: docker/setup-buildx-action@v4
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.API_SERVICE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=grabit-api
          cache-to: type=gha,mode=max,scope=grabit-api

  build-web-image:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev
      - uses: docker/setup-buildx-action@v4
      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.CLOUD_RUN_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.CLOUD_RUN_API_URL }}
            NEXT_PUBLIC_R2_HOSTNAME=${{ secrets.R2_PUBLIC_HOSTNAME }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.WEB_SERVICE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=grabit-web
          cache-to: type=gha,mode=max,scope=grabit-web

  deploy-api:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    needs:
      - migrate-production
      - build-api-image
      - build-web-image
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.API_SERVICE }}:${{ env.DEPLOY_SHA }}
          flags: >-
            --service-account=grapit-cloudrun@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
            --min-instances=0
            --max-instances=100
            --memory=512Mi
            --cpu=1
            --port=8080
            --no-cpu-throttling
            --session-affinity
            --allow-unauthenticated
            --network=default
            --subnet=default
            --vpc-egress=private-ranges-only
          env_vars: |
            NODE_ENV=production
            VALKEY_MODE=cluster
            FRONTEND_URL=${{ vars.CLOUD_RUN_WEB_URL }}
            KAKAO_CALLBACK_URL=${{ vars.CLOUD_RUN_API_URL }}/api/v1/auth/social/kakao/callback
            NAVER_CALLBACK_URL=${{ vars.CLOUD_RUN_API_URL }}/api/v1/auth/social/naver/callback
            GOOGLE_CALLBACK_URL=${{ vars.CLOUD_RUN_API_URL }}/api/v1/auth/social/google/callback
            PREWARM_ALLOWED_SERVICE_NAME=${{ env.API_SERVICE }}
            PREWARM_MAX_MIN_INSTANCES=100
          secrets: |
            DATABASE_URL=database-url:latest
            JWT_SECRET=jwt-secret:latest
            JWT_REFRESH_SECRET=jwt-refresh-secret:latest
            KAKAO_CLIENT_ID=kakao-client-id:latest
            KAKAO_CLIENT_SECRET=kakao-client-secret:latest
            NAVER_CLIENT_ID=naver-client-id:latest
            NAVER_CLIENT_SECRET=naver-client-secret:latest
            GOOGLE_CLIENT_ID=google-client-id:latest
            GOOGLE_CLIENT_SECRET=google-client-secret:latest
            REDIS_URL=redis-url:latest
            R2_ACCOUNT_ID=r2-account-id:latest
            R2_BUCKET_NAME=r2-bucket-name:latest
            R2_PUBLIC_URL=r2-public-url:latest
            R2_ACCESS_KEY_ID=r2-access-key-id:latest
            R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest
            RESEND_API_KEY=resend-api-key:latest
            RESEND_FROM_EMAIL=resend-from-email:latest
            TWILIO_ACCOUNT_SID=twilio-account-sid:latest
            TWILIO_API_KEY_SID=twilio-api-key-sid:latest
            TWILIO_API_KEY_SECRET=twilio-api-key-secret:latest
            TWILIO_VERIFY_SERVICE_SID=twilio-verify-service-sid:latest
            SENTRY_DSN=sentry-dsn:latest
            TOSS_SECRET_KEY=toss-secret-key:latest
            PREWARM_CONTROL_TOKEN=prewarm-control-token:latest
            PREWARM_PROJECT_ID=prewarm-project-id:latest
            PREWARM_REGION=prewarm-region:latest
            PREWARM_ALLOWED_SCHEDULER_EMAIL=prewarm-allowed-scheduler-email:latest
            PREWARM_ALLOWED_AUDIENCE=prewarm-allowed-audience:latest

  deploy-web:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.WEB_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.WEB_SERVICE }}:${{ env.DEPLOY_SHA }}
          flags: >-
            --service-account=grapit-cloudrun@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --port=3000
            --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
          secrets: |
            SENTRY_DSN=sentry-dsn-web:latest
