name: Isolated image timing
on:
  push:
    branches: [ps/perf/deploy-and-pr-ci]
    paths: [.github/workflows/image-timing.yml]
permissions:
  contents: read
  actions: write
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
        profile: [legacy, layers, candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare credential-free source
        env:
          PROFILE: ${{ matrix.profile }}
          APP: ${{ matrix.app }}
        run: |
          mkdir -p "$RUNNER_TEMP/grapit-context"
          git archive 022f15debb18a46ecad28eba02dd3209329728e2 | tar -x -C "$RUNNER_TEMP/grapit-context"
          if [[ "$PROFILE" != legacy ]]; then
            cp .dockerignore "$RUNNER_TEMP/grapit-context/"
            cp "apps/$APP/Dockerfile" "$RUNNER_TEMP/grapit-context/apps/$APP/"
          fi
      - name: Fresh seed builder
        uses: docker/setup-buildx-action@v4
        id: seed
      - name: Measure seed
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.seed.outputs.name }}
          context: ${{ runner.temp }}/grapit-context
          file: ${{ runner.temp }}/grapit-context/apps/${{ matrix.app }}/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/seed.tar
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.grapit-benchmark.invalid
          cache-to: type=gha,mode=${{ matrix.profile == 'candidate' && 'min' || 'max' }},scope=timing-${{ github.run_id }}-${{ matrix.app }}-${{ matrix.profile }}-seed
      - name: Release seed builder disk
        env:
          BUILDER: ${{ steps.seed.outputs.name }}
        run: |
          docker buildx rm "$BUILDER"
          rm -f "$RUNNER_TEMP/seed.tar"
      - name: Apply source-only fixture
        working-directory: ${{ runner.temp }}/grapit-context
        run: |
          echo 'export const pipelineTimingFixture = true;' >> apps/api/src/main.ts
          echo 'export const pipelineSharedFixture = true;' >> packages/shared/src/index.ts
          sed -i "s/sort: 'opening', limit: 10/sort: 'opening', limit: 9/" apps/web/app/page.tsx
      - name: Fresh source builder
        uses: docker/setup-buildx-action@v4
        id: source
      - name: Measure source
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.source.outputs.name }}
          context: ${{ runner.temp }}/grapit-context
          file: ${{ runner.temp }}/grapit-context/apps/${{ matrix.app }}/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/source.tar
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.grapit-benchmark.invalid
          cache-from: type=gha,scope=timing-${{ github.run_id }}-${{ matrix.app }}-${{ matrix.profile }}-seed
          cache-to: type=gha,mode=${{ matrix.profile == 'candidate' && 'min' || 'max' }},scope=timing-${{ github.run_id }}-${{ matrix.app }}-${{ matrix.profile }}-source
      - name: Release source builder disk
        env:
          BUILDER: ${{ steps.source.outputs.name }}
        run: |
          docker buildx rm "$BUILDER"
          rm -f "$RUNNER_TEMP/source.tar"
      - name: Also change a frozen dependency
        working-directory: ${{ runner.temp }}/grapit-context
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          path = Path("apps/api/package.json")
          manifest = json.loads(path.read_text())
          manifest["devDependencies"]["semver"] = "7.7.4"
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          path = Path("pnpm-lock.yaml")
          lock = path.read_text()
          section = lock.index("    devDependencies:", lock.index("\n  apps/api:")) + len("    devDependencies:")
          addition = "\n      semver:\n        specifier: 7.7.4\n        version: 7.7.4"
          path.write_text(lock[:section] + addition + lock[section:])
          PYTHON
      - name: Fresh lock builder
        uses: docker/setup-buildx-action@v4
        id: lock
      - name: Measure lock
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.lock.outputs.name }}
          context: ${{ runner.temp }}/grapit-context
          file: ${{ runner.temp }}/grapit-context/apps/${{ matrix.app }}/Dockerfile
          outputs: type=oci,dest=${{ runner.temp }}/lock.tar
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.grapit-benchmark.invalid
          cache-from: type=gha,scope=timing-${{ github.run_id }}-${{ matrix.app }}-${{ matrix.profile }}-seed
          cache-to: type=gha,mode=${{ matrix.profile == 'candidate' && 'min' || 'max' }},scope=timing-${{ github.run_id }}-${{ matrix.app }}-${{ matrix.profile }}-lock
      - name: Release lock builder disk
        env:
          BUILDER: ${{ steps.lock.outputs.name }}
        run: |
          docker buildx rm "$BUILDER"
          rm -f "$RUNNER_TEMP/lock.tar"
