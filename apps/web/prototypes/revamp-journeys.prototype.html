<style>
:root{--purple:#6d28d9;--ink:#172033;--muted:#667085;--line:#e5e8ef;--soft:#f6f7fb;--green:#067647;--amber:#9a6700}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#fff}button,input,select{font:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px 17px;color:var(--ink);min-height:46px}button:hover{border-color:var(--purple)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b69aee;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.text{border:0;color:var(--purple);padding:8px}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:18px}.stack{display:flex;flex-direction:column;gap:16px}.muted,small{color:var(--muted)}small{font-size:13px}.tag{display:inline-block;padding:3px 10px;background:#f1e9ff;color:var(--purple);border-radius:20px;font-size:13px}.green{color:var(--green)}.amber{color:var(--amber)}.notice{border-radius:8px;background:#f3efff;padding:16px 20px;margin:20px 0}.warning{background:#fff6df;color:var(--amber)}.success{background:#eaf9f1;color:var(--green)}header{height:80px;border-bottom:1px solid var(--line);padding:0 max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:29px;font-weight:850;color:var(--purple);letter-spacing:-1px}.nav{display:flex;gap:12px}.nav button{border:0;background:transparent}.intro{background:var(--soft);padding:16px 24px;font-size:13px;border-bottom:1px solid var(--line)}.intro strong{color:var(--purple)}main{max-width:1200px;margin:0 auto;padding:42px 24px 70px;min-height:630px}h1{font-size:38px;line-height:1.28;letter-spacing:-1.3px;margin:8px 0 18px}h2{font-size:23px;letter-spacing:-.4px;margin:0 0 18px}h3{font-size:17px;margin:0 0 10px}p{margin:8px 0 18px}.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:48px;margin-top:30px}.panel{background:var(--soft);padding:25px;border:1px solid var(--line);border-radius:10px}.section{padding:24px 0;border-bottom:1px solid var(--line)}.section:first-child{padding-top:0}.data{display:grid;grid-template-columns:140px 1fr;gap:12px;font-size:15px}.price{font-size:28px;font-weight:750}.seatgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:30px 0}.seatgrid button[aria-pressed=true]{background:var(--purple);color:white}.stage{text-align:center;background:#eceef4;padding:12px;letter-spacing:8px;color:var(--muted)}label{display:flex;flex-direction:column;gap:6px}input,select{min-height:48px;padding:10px 14px;border:1px solid #ccd2df;border-radius:7px;background:#fff;min-width:0}label.check{flex-direction:row;align-items:center}input[type=checkbox]{min-height:22px;min-width:22px;accent-color:var(--purple)}.ticket{padding:24px 0;border-top:1px solid var(--line)}.ticket h2{font-size:26px;margin:8px 0}.qr{display:grid;place-items:center;min-height:125px;border:2px dashed #c8c3d4;color:var(--muted);margin:12px 0}.hero{padding:38px 0 30px}.hero p{font-size:20px}.event-row{border-bottom:1px solid var(--line);padding:24px 0}.event-cover{background:#efe8fa;padding:32px;min-height:210px;display:flex;align-items:flex-end;border-radius:10px;font-size:32px;font-weight:850;color:var(--purple);line-height:1.15}.steps{display:flex;gap:18px;font-size:14px;color:var(--muted);padding-bottom:20px;border-bottom:1px solid var(--line)}.steps strong{color:var(--purple)}.admin{display:grid;grid-template-columns:170px minmax(0,1fr);gap:38px}.sidebar{border-right:1px solid var(--line);padding-right:18px}.sidebar button{border:0;text-align:left;width:100%;margin-bottom:8px}.active{background:#eee6fa!important;color:var(--purple)!important}.admin .split{gap:28px;grid-template-columns:minmax(0,2.6fr) minmax(220px,1fr)}.checkrow{display:grid;grid-template-columns:24px minmax(110px,1fr) minmax(80px,1fr) auto;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:18px 0}.field{max-width:430px;margin:auto}.camera{height:250px;background:#23252a;color:white;display:grid;place-items:center;border-radius:10px;margin:20px 0}.large-seat{font-size:39px;letter-spacing:-1px}.controls{max-width:1200px;margin:auto;border-top:1px solid var(--line);padding:24px;background:var(--soft)}.controls button{font-size:13px;padding:8px 12px;min-height:40px}.controls .row{justify-content:flex-start;flex-wrap:wrap;gap:8px}.facts{margin-top:20px;display:flex;gap:24px;flex-wrap:wrap;font-size:13px}.facts span{display:flex;flex-direction:column}.facts b{font-weight:650}.view-toggle{font-size:12px}.phone main{max-width:440px}.phone .split,.phone .admin{display:block}.phone .sidebar{display:none}.phone h1{font-size:30px}.phone .panel{margin-top:24px}.phone .nav{display:none}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:14px 8px}th{background:var(--soft)}@media(max-width:760px){header{height:68px;padding:0 20px}.nav{display:none}main{padding:28px 20px 44px}h1{font-size:30px}.split,.admin,.admin .split{display:block}.panel{margin-top:24px}.sidebar{display:none}.data{grid-template-columns:100px 1fr}.checkrow{gap:8px;grid-template-columns:20px 1.4fr 1fr auto}.checkrow button{padding:8px}.large-seat{font-size:35px}.event-cover{min-height:160px}.controls{padding:20px}}
</style>
<div class="intro"><strong>조작형 시안 · 실제 결제/입장 아님</strong> — 결제 복귀 뒤 같은 예매를 이어가고, 일부 취소·판매 검수·통신 장애를 오해 없이 처리할 수 있는지 검토합니다. 모든 인물·공연·금액은 가상 자료입니다.</div>
<header><div class="brand">Grabit</div><nav class="nav"><button data-action="home">공연 찾기</button><button data-action="tickets">내 티켓</button><button data-action="admin">공연 운영</button><button data-action="field">현장 운영</button></nav><button data-action="locale" aria-label="언어 전환">한국어 / EN</button></header>
<main id="view"></main>
<section class="controls" aria-label="프로토타입 시나리오"><h3>시나리오 직접 실행</h3><p><small>아래 조작은 실제 PG·네트워크·권한을 흉내 내는 시안 전용 버튼입니다. 제품에는 포함하지 않습니다.</small></p><div class="row" role="tablist"><button role="tab" data-scenario="buyer">구매자 · 중단과 복귀</button><button role="tab" data-scenario="admin">운영자 · 검수와 공개</button><button role="tab" data-scenario="field">현장 · 동행자와 통신 장애</button></div><p id="walkthrough"></p><div class="row" id="actions"></div><div class="facts" id="facts"></div><p><button data-action="reset">처음 상태로</button> <button data-action="phone" class="view-toggle">모바일 폭 전환</button></p></section>
<script>
// Pure, in-memory state model. Prototype only; not a substitute for server truth.
const initial=()=>({role:'buyer',screen:'home',locale:'ko',verified:false,consent:false,seats:[],order:null,payment:'none',cancel:'none',ticketA:'active',ticketB:'active',entered:[],redeemed:[],online:true,pending:[],ready:[true,true,false,true,false],published:false,permission:true,finance:'idle',cs:'unknown',notice:'',scenario:'buyer',step:0});
function transition(s,a){let n={...s,notice:''};switch(a){
case'home':n.role='buyer';n.screen='home';break;case'detail':n.screen='detail';break;
case'book':n.screen=s.verified?'seats':'auth';break;case'auth-error':n.notice='확인 코드가 일치하지 않습니다. 입력을 다시 확인하거나 재전송하세요.';break;
case'verify':n.verified=true;n.screen='seats';n.notice='인증을 완료하고 선택한 공연으로 돌아왔습니다.';break;
case'locale':n.locale=s.locale==='ko'?'en':'ko';n.notice='선택 언어가 다음 화면에도 유지됩니다.';break;
case'seat-a':case'seat-b':{const x=a==='seat-a'?'4':'5';n.seats=s.seats.includes(x)?s.seats.filter(y=>y!==x):[...s.seats,x];break;}
case'checkout':if(!s.seats.length){n.notice='먼저 좌석을 선택하세요.';break;}n.screen='checkout';n.order=s.order||'시안 예매 1';n.payment=s.payment==='none'?'pending':s.payment;break;
case'consent':n.consent=!s.consent;break;case'pay':if(s.consent){n.screen='return';n.payment='unknown';}break;case'pg-stop':n.screen='return';n.payment='pending';n.notice='결제가 중단되었습니다. 같은 예매를 다시 확인했습니다.';break;
case'pg-approved':n.payment='confirmed';n.screen='tickets';n.notice='같은 예매의 결제를 확인했습니다.';break;
case'recheck':if(s.payment==='unknown'){n.notice='아직 확인 중입니다. 새 결제를 요청하지 마세요.';}else if(s.payment==='confirmed'){n.screen='tickets';}else{n.screen='checkout';}break;
case'expire':n.payment='expired';n.screen='return';break;case'reselect':n.order=null;n.payment='none';n.seats=[];n.screen='seats';break;
case'tickets':n.role='buyer';n.screen='tickets';break;case'cancel-preview':n.screen='cancel';break;
case'cancel-request':n.cancel='processing';n.ticketA='cancellation_pending';n.screen='tickets';n.notice='4번 좌석의 취소를 접수했습니다. 5번은 유효합니다.';break;
case'cancel-done':if(s.cancel==='processing'){n.cancel='completed';n.ticketA='cancelled';n.notice='4번 좌석의 PG 취소가 완료됐습니다. 카드사 반영에는 시간이 걸릴 수 있습니다.';}break;
case'admin':n.role='admin';n.screen='prepare';break;case'review':n.notice=s.ready.every(Boolean)?'판매 준비를 모두 확인했습니다.':'다국어 콘텐츠와 판매 일정 확인이 필요합니다.';break;
case'fix-translation':n.ready=s.ready.map((x,i)=>i===2?true:x);n.notice='다국어 콘텐츠 검수를 완료했습니다.';break;
case'fix-schedule':n.ready=s.ready.map((x,i)=>i===4?true:x);n.notice='판매 시작 일정을 저장했습니다.';break;
case'publish-preview':if(!s.permission){n.notice='공개 권한이 없습니다. 승인 담당자에게 요청하세요.';}else if(!s.ready.every(Boolean)){n.notice='미완료 항목을 먼저 확인하세요.';}else{n.screen='publish';}break;
case'publish':if(s.permission&&s.ready.every(Boolean)){n.published=true;n.screen='prepare';n.notice='공연이 공개됐습니다. 예매는 설정한 판매 시작 시각에 열립니다.';}break;
case'permission':n.permission=!s.permission;break;case'cs':n.screen='cs';break;case'cs-detail':n.screen='cs-detail';break;case'cs-check':n.cs='confirmed';n.notice='공급자 상태를 다시 조회해 기존 예매의 승인을 확인했습니다. 새로운 결제를 요청하지 않았습니다.';break;case'cs-failure':n.notice='조회에 실패했습니다. 거래 상태는 변경하지 않았습니다. 다시 조회하거나 확인 필요로 남겨 주세요.';break;case'finance':n.screen='finance';break;case'finance-load':n.finance='loaded';break;case'finance-error':n.finance='error';break;
case'field':n.role='field';n.screen='scan';break;case'scan-a':case'scan-b':n.screen=a==='scan-a'?'ticket-a':'ticket-b';break;
case'enter':{const x=s.screen==='ticket-a'?'4':'5';if(s.entered.includes(x)){n.notice='이미 입장한 좌석입니다. 중복 집계하지 않습니다.';}else if(x==='4'&&s.ticketA!=='active'){n.notice='취소된 좌석은 입장 처리할 수 없습니다.';}else if(!s.online){n.pending=[...new Set([...s.pending,x])];n.notice='동기화 대기입니다. 서버 입장은 아직 확정되지 않았습니다.';}else{n.entered=[...s.entered,x];n.notice=x+'번 좌석의 입장을 처리했습니다. 다른 좌석은 변경되지 않았습니다.';}break;}
case'redeem':{const x=s.screen==='ticket-a'?'4':'5';if(!s.online){n.notice='특전 지급은 연결 후 처리해 주세요.';}else if(s.redeemed.includes(x)){n.notice='이미 지급한 품목입니다.';}else if(x==='4'&&s.ticketA!=='active'){n.notice='취소된 좌석의 특전은 지급할 수 없습니다.';}else{n.redeemed=[...s.redeemed,x];n.notice='포토카드 지급을 기록했습니다.';}break;}
case'offline':n.online=false;break;case'online':n.online=true;n.entered=[...new Set([...s.entered,...s.pending.filter(x=>x!=='4'||s.ticketA==='active')])];n.pending=[];n.notice='대기 기록을 서버와 대조했습니다.';break;
}return n;}
</script>
<script>
let state=initial();const $=id=>document.getElementById(id);const btn=(text,action,cls='',disabled=false)=>`<button data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${text}</button>`;
const eventInfo=()=>`<span class="tag">팬미팅 · 판매 중</span><h2>2026 GIRL RULES FANMEETING</h2><p class="muted">2026.11.20 (금) 11:58 KST<br>서울 · 테스트 공연장</p>`;
const eventRows=()=>`<div class="event-row row"><div><strong>2026 GIRL RULES FANMEETING</strong><div class="muted">11.20 · 서울 · 380,000원부터</div></div>${btn('공연 보기','detail','text')}</div>`;
function buyer(){const en=state.locale==='en',count=state.seats.length||2;if(state.screen==='home')return `<div class="hero"><small>LIVE MOMENTS, TOGETHER</small><h1>${en?'Find your next live moment':'다음 만남을 찾아보세요'}</h1><p class="muted">공연과 팬미팅의 시작부터, 내 티켓까지.</p><label>공연 검색<input placeholder="공연명 또는 아티스트" aria-label="공연 검색"></label></div><div class="split"><div class="event-cover">GIRL RULES<br>FANMEETING</div><div>${eventInfo()}${btn('공연 자세히 보기','detail','primary')}</div></div><div class="section"><h2>지금 만날 수 있는 공연</h2>${eventRows()}</div>`;
if(state.screen==='detail')return `${btn('공연 목록','home','text')}<div class="split"><div class="event-cover">GIRL RULES<br>FANMEETING</div><div>${eventInfo()}<div class="data"><span>관람 등급</span><b>만 15세 이상</b><span>티켓 가격</span><b>380,000원 + 수수료 2,000원 / 장</b></div><p class="muted">회차와 좌석을 선택한 뒤 최종 청구 금액을 확인할 수 있습니다.</p>${btn(en?'Choose seats':'좌석 선택','book','primary wide')}</div></div>`;
if(state.screen==='auth')return `<div style="max-width:460px;margin:auto"><small>예매 전 계정 확인</small><h1>${en?'Verify and continue':'확인 후 예매를 이어가세요'}</h1><p class="muted">인증을 마치면 GIRL RULES 좌석 선택으로 돌아갑니다.</p><div class="stack"><label>이메일<input value="mina@example.test" autocomplete="off"></label><label>확인 코드<input placeholder="확인 코드 6자리" inputmode="numeric"></label>${btn('확인 코드 오류 재현','auth-error')}${btn('테스트 인증 완료','verify','primary')}</div></div>`;
if(state.screen==='seats')return `<div class="steps"><strong>1 좌석 선택</strong><span>2 내용 확인·결제</span><span>3 내 티켓</span></div><h1>${en?'Choose your seats':'좌석을 선택하세요'}</h1><div class="split"><section><div class="stage">STAGE</div><div class="seatgrid">${[1,2,3,4,5,6].map(x=>`<button ${![4,5].includes(x)?'disabled':''} data-action="seat-${x===4?'a':'b'}" aria-pressed="${state.seats.includes(String(x))}" aria-label="가열 ${x}번">${x}</button>`).join('')}</div><p class="muted">1층 · 가열 · SVIP</p></section><aside class="panel"><h2>선택한 좌석</h2><p>${state.seats.length?state.seats.map(x=>'가열 '+x+'번').join(', '):'아직 선택하지 않았습니다'}</p><strong>${(state.seats.length*382000).toLocaleString()}원</strong><p>${btn(en?'Continue':'예매 내용 확인','checkout','primary wide',!state.seats.length)}</p></aside></div>`;
if(state.screen==='checkout')return `<div class="steps"><span>1 좌석 선택</span><strong>2 내용 확인·결제</strong><span>3 내 티켓</span></div><h1>${en?'Review your booking':'예매 내용을 확인해 주세요'}</h1><div class="split"><div><section class="section">${eventInfo()}</section><section class="section"><h2>선택 좌석</h2>${state.seats.map(x=>`<p class="row"><strong>1층 가열 ${x}번 · SVIP</strong><span>380,000원</span></p>`).join('')}</section><section class="section"><h2>예매자</h2><p>김민아 · mina@example.test</p><label class="check"><input type="checkbox" data-consent ${state.consent?'checked':''}>예매 내용과 취소 규정을 확인했습니다.</label></section></div><aside class="panel"><h2>결제 금액</h2><p class="row"><span>티켓 ${count}장</span><span>${(count*380000).toLocaleString()}원</span></p><p class="row"><span>예매 수수료</span><span>${(count*2000).toLocaleString()}원</span></p><p class="row"><strong>주문 합계</strong><strong>${(count*382000).toLocaleString()}원</strong></p><div class="section"><small>실제 청구 금액</small><div class="price">USD ${(count*259.76).toFixed(2)}</div><p class="muted">결제 시 이 금액으로 청구됩니다.</p></div><label>결제 수단<select><option>해외 카드 · Toss 결제창 (시안)</option></select></label><p><small>선택한 좌석은 서버 마감 시각까지 유지됩니다.</small></p>${btn('USD '+(count*259.76).toFixed(2)+' 결제하기','pay','primary wide',!state.consent)}</aside></div>`;
if(state.screen==='return')return `<div style="max-width:600px;margin:40px auto"><h1>${state.payment==='expired'?'예매 시간이 만료됐어요':state.payment==='pending'?'결제가 중단됐어요':'결제 상태를 확인하고 있어요'}</h1><p class="muted">${state.payment==='unknown'?'승인 여부를 확인하기 전에는 다시 결제하지 마세요.':state.payment==='pending'?'선택한 좌석과 같은 예매로 이어갈 수 있습니다.':'좌석을 다시 선택하고 진행해 주세요.'}</p><div class="panel"><strong>${state.order}</strong><p>1층 가열 ${state.seats.join(', ')}번</p>${btn(state.payment==='expired'?'좌석 다시 선택':state.payment==='pending'?'같은 예매 이어가기':'상태 다시 확인',state.payment==='expired'?'reselect':'recheck','primary wide')}</div>${btn('내 티켓 확인','tickets','text')}</div>`;
if(state.screen==='cancel')return `<div style="max-width:650px;margin:auto"><small>좌석별 취소</small><h1>이 좌석을 취소할까요?</h1><div class="section"><h2>1층 가열 4번</h2><div class="data"><span>티켓·수수료</span><b>382,000원</b><span>취소 수수료</span><b>0원 (시안의 당일 조건)</b><span>예상 환불액</span><b>382,000원 · USD 259.76</b></div></div><p class="notice">5번 좌석은 취소하지 않으며 티켓과 특전이 유지됩니다.</p>${btn('4번 좌석 취소 요청','cancel-request','primary')}${btn('티켓으로 돌아가기','tickets','text')}</div>`;
if(state.payment!=='confirmed')return `<h1>내 티켓</h1><div class="notice">아직 결제가 확인된 티켓이 없습니다. 결제 중인 예매의 상태를 먼저 확인해 주세요.</div>${btn('진행 중 예매 확인','recheck','primary')}`;
return `<small>예매 내역 · ${state.order}</small><h1>${en?'Your tickets':'내 티켓'}</h1>${eventInfo()}<div class="split">${['4','5'].map(x=>{const valid=x==='5'||state.ticketA==='active';return `<article class="ticket"><span class="tag">${valid?'유효한 티켓':state.ticketA==='cancelled'?'취소 완료':'취소 처리 중'}</span><h2>1층 가열 ${x}번</h2>${valid?`<div class="qr">QR 표시 영역 · 시안에는 실제 QR 없음</div><p>입장 전 · 포토카드 미수령</p>`:`<p>${state.cancel==='completed'?'PG 취소 완료 · 카드사 반영 대기':'PG 취소 확인 중'}</p><p>382,000원 · USD 259.76</p>`}${x==='4'&&valid?btn('이 좌석 취소','cancel-preview'):''}</article>`}).join('')}</div>`;}
function admin(){const labels=['기본 정보','회차·좌석·가격','다국어 콘텐츠','특전 설정','판매 일정'];let content=state.screen==='cs'?`<h1>예매와 고객 대응</h1><p class="muted">선택 공연의 확인이 필요한 거래입니다.</p><div class="event-row row"><div><strong>결제 상태 확인 필요</strong><p>김민아 · 1층 가열 4·5번 · 764,000원</p><small>콜백 확인되지 않음 · 공급자 조회 필요</small></div>${btn('예매 확인','cs-detail','primary')}</div>`:state.screen==='cs-detail'?`<small>예매 상세</small><h1>김민아 · 가열 4·5번</h1><p>주문 764,000원 · PG 청구 USD 519.52</p><div class="notice">${state.cs==='confirmed'?'공급자 승인 확인 · 유효 티켓 2장':'결제 상태 확인 필요 · 아직 새 결제를 요청하지 마세요'}</div><div class="data"><span>입장</span><b>2장 모두 입장 전</b><span>특전</span><b>2장 모두 미수령</b><span>조회 기록</span><b>${state.cs==='confirmed'?'방금 승인 확인':'이전 조회 실패 · 미확정'}</b></div><p>${btn('공급자 상태 다시 조회','cs-check','primary')}${btn('조회 실패 재현','cs-failure')}</p><p class="muted">확인 결과와 실제 조치는 각각 기록합니다.</p>`:state.screen==='publish'?`<h1>공개 내용을 확인하세요</h1>${eventInfo()}<p class="notice">공연 공개 후에도 예매는 설정한 판매 시작 시각에 열립니다.</p>${btn('공연 공개 확정','publish','primary')}`:state.screen==='finance'?`<h1>매출과 정산 대조</h1><p class="muted">공연 · 전체 회차 · 승인일 기준 · KST</p>${state.finance==='idle'?'<div class="notice">아직 조회하지 않았습니다. 기간을 선택한 뒤 조회하세요.</div>':state.finance==='error'?'<div class="notice warning">조회에 실패했습니다. 이전 결과를 0원으로 표시하지 않습니다.</div>':'<table><thead><tr><th>항목</th><th>KRW</th><th>공급자 USD</th></tr></thead><tbody><tr><td>원 결제</td><td>764,000원</td><td>519.52</td></tr><tr><td>완료 취소</td><td>382,000원</td><td>259.76</td></tr><tr><td>잔여 청구</td><td>382,000원</td><td>259.76</td></tr><tr><td>은행 실입금</td><td colspan="2">증빙 미확인</td></tr></tbody></table>'}${btn('조회','finance-load','primary')}`:`<small>공연 운영</small><h1>공연을 준비하고 운영하세요</h1><p class="muted">준비 상태를 확인하고 다음 업무를 이어갑니다.</p><div class="row"><label>공연 선택<select><option>2026 GIRL RULES FANMEETING</option></select></label><label>회차<select><option>2026.11.20 11:58 KST</option></select></label></div><div class="steps" style="margin-top:24px"><strong>준비</strong><span>판매</span><span>고객 대응</span><span>현장</span><span>정산</span></div><div class="split"><section><div class="row"><h2>판매 준비</h2>${btn('검수하기','review','primary')}</div>${labels.map((l,i)=>`<div class="checkrow"><b class="${state.ready[i]?'green':'amber'}">${state.ready[i]?'✓':'!'}</b><strong>${l}</strong><span class="${state.ready[i]?'green':'amber'}">${state.ready[i]?'완료':'확인 필요'}</span>${i===2?btn('번역 확인','fix-translation','text'):i===4?btn('일정 설정','fix-schedule','text'):'<span>저장됨</span>'}</div>`).join('')}<p>${btn(state.published?'공개 완료':'공개 내용 확인','publish-preview','primary',state.published)}</p></section><aside class="panel"><h3>판매 전 확인</h3><p>게시와 판매 시작은 구분됩니다.</p><p class="muted">공개 전에 준비 항목을 검수하고 구매자 화면을 확인하세요.</p>${btn('구매자 화면 보기','detail','text')}</aside></div>`;return `<div class="admin"><aside class="sidebar"><small>운영</small>${btn('공연','admin','active')}${btn('예매·고객','cs')}${btn('정산','finance')}<small>권한: ${state.permission?'승인 담당자':'조회만 가능'}</small></aside><section>${content}</section></div>`;}
function field(){const chosen=state.screen==='ticket-a'?'4':'5',viewing=state.screen.startsWith('ticket-'),valid=chosen==='5'||state.ticketA==='active',entered=state.entered.includes(chosen);return `<div class="field"><strong>GIRL RULES FANMEETING</strong><p class="muted">11.20 11:58 KST · 현장 운영</p><div class="notice ${state.online?'success':'warning'}">${state.online?'● 온라인 · 서버와 연결돼 있습니다':'⚠ 연결이 끊겼습니다 · 서버 확인 대기'}</div><h1>${!state.online?'서버 확인을 기다리고 있어요':viewing?(valid?(entered?'이미 입장한 티켓':'입장 가능한 티켓'):'취소된 티켓'):'입장 확인'}</h1>${viewing?`<small>좌석 정보</small><h2 class="large-seat">1층 가열 ${chosen}번</h2><span class="tag">SVIP</span><div class="section"><div class="data"><span>예매자</span><b>김민아</b><span>입장</span><b>${entered?'입장 완료':state.pending.includes(chosen)?'동기화 대기':'아직 입장하지 않음'}</b></div></div><p>${btn(state.online?'이 좌석 입장 처리':state.pending.includes(chosen)?'동기화 대기 중':'입장 대기 기록','enter','primary wide',!valid||entered||state.pending.includes(chosen))}</p>${btn('다른 QR 확인','field','wide')}<div class="section"><h3>특전</h3><div class="row"><b>포토카드</b><span>${state.redeemed.includes(chosen)?'수령 완료':'미수령'}</span>${btn('지급 확인','redeem','',!state.online||!valid||state.redeemed.includes(chosen))}</div><p><small>입장과 특전 수령은 각각 처리합니다.</small></p></div>`:`<div class="camera">QR을 화면 안에 맞춰 주세요</div><p class="muted">한 번에 한 좌석을 확인합니다.</p><div class="stack">${btn('4번 QR 확인 (가상)','scan-a','primary')}${btn('5번 QR 확인 (가상)','scan-b')}</div>`}<div class="row section"><div><small>서버 입장 확인</small><h2>${state.entered.length}명</h2></div><div><small>동기화 대기</small><h2>${state.pending.length}건</h2></div></div>${!state.online?`<p class="amber">대기 기록은 아직 입장이 확정되지 않았습니다. 특전 지급은 연결 후 처리하세요.</p>${btn('다시 연결','online','wide')}`:''}</div>`;}
const scenarios={buyer:['공연을 보고 인증한 뒤 4·5번을 선택합니다. 결제 중단/불명 상태에서 예매가 바뀌지 않는지 보고, 승인 뒤 4번만 취소합니다.',['pg-stop','pg-approved','expire','cancel-done']],admin:['준비 누락을 확인하고 번역·일정을 완료합니다. 조회 권한으로는 공개할 수 없으며 정산 조회 전·실패·값이 구분됩니다.',['permission','finance-error']],field:['동행자가 따로 오는 상황입니다. 4번을 입장 처리해도 5번은 남습니다. offline 기록은 확인 전 집계하지 않고 특전은 지급할 수 없습니다.',['offline','online']]};
const actionNames={'pg-stop':'결제창 중단 재현','pg-approved':'공급자 승인 확인 재현','expire':'마감 만료 재현','cancel-done':'PG 취소 완료 재현',permission:'운영 권한 전환','finance-error':'정산 조회 오류 재현',offline:'통신 단절 재현',online:'통신 복구 재현'};
function render(){document.documentElement.lang=state.locale;$('view').innerHTML=(state.notice?`<div role="status" class="notice">${state.notice}</div>`:'')+(state.role==='admin'?admin():state.role==='field'?field():buyer());$('walkthrough').textContent=scenarios[state.scenario][0];$('actions').innerHTML=scenarios[state.scenario][1].map(a=>btn(actionNames[a],a)).join('');$('facts').innerHTML=Object.entries({'언어':state.locale,'예매':state.order||'없음','결제':{none:'시작 전',pending:'미결제',unknown:'확인 중',confirmed:'확정',expired:'만료'}[state.payment],'4번 티켓':state.ticketA,'5번 티켓':state.ticketB,'PG 취소':state.cancel,'서버 입장':state.entered.join(', ')||'없음','대기 입장':state.pending.join(', ')||'없음','지급 좌석':state.redeemed.join(', ')||'없음'}).map(([k,v])=>`<span>${k}<b>${v}</b></span>`).join('');document.querySelectorAll('[data-scenario]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.scenario===state.scenario)));}
document.addEventListener('change',e=>{if(e.target.matches('[data-consent]')){state=transition(state,'consent');render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scenario){const sc=b.dataset.scenario;state=initial();state.scenario=sc;if(sc==='admin')state=transition(state,'admin');if(sc==='field'){state.payment='confirmed';state.order='시안 예매 1';state.seats=['4','5'];state=transition(state,'field');}render();return;}const a=b.dataset.action;if(!a)return;if(a==='phone'){document.body.classList.toggle('phone');return;}if(a==='reset'){state=initial();}else{if(a==='detail')state.role='buyer';state=transition(state,a);}render();window.scrollTo(0,0);});render();
</script></html>
